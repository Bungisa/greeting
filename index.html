    <script>
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          const PatchedWebSocket = function (url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && url.includes('token='));
            if (isViteHmr) {
              const dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.send = function () {};
              dummy.close = function () {};
              dummy. bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = 'vite-hmr';
              dummy.url = String(url || '');
              dummy.binaryType = 'blob';
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>

    <script>
      (function () {
        try {
          var mode = localStorage.getItem('elimika_theme_mode');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            var legacy = localStorage.getItem('elimika_dark_mode');
            mode = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'system';
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
          root.setAttribute('data-theme-mode', mode);
        } catch (e) {}
      })();
    </script>
