    <script>
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          const PatchedWebSocket = function (url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && url.includes('token='));
            if (isViteHmr) {
              const dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.send = function () {};
              dummy.close = function () {};
              dummy. bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = 'vite-hmr';
              dummy.url = String(url || '');
              dummy.binaryType = 'blob';
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>

    <script>
      (function () {
        try {
          var mode = localStorage.getItem('elimika_theme_mode');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            var legacy = localStorage.getItem('elimika_dark_mode');
            mode = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'system';
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
          root.setAttribute('data-theme-mode', mode);
        } catch (e) {}
      })();
    </script>

    <script>
      // Self-healing CSS & Service Worker cache recovery for installed mobile PWAs
      (function () {
        var CACHE_GUARD_KEY = 'elimika_sw_css_guard_v4_2027';
        function purgeStaleCachesAndReload() {
          try {
            if (sessionStorage.getItem('elimika_css_recovering') === '1') return;
            sessionStorage.setItem('elimika_css_recovering', '1');
          } catch (e) {}
          Promise.all([
            'caches' in window
              ? caches.keys().then(function (names) {
                  return Promise.all(names.map(function (n) { return caches.delete(n); }));
                })
              : Promise.resolve(),
            'serviceWorker' in navigator
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              : Promise.resolve()
          ]).finally(function () {
            try { localStorage.setItem(CACHE_GUARD_KEY, '1'); } catch (e) {}
            window.location.replace(window.location.pathname + '?v=' + Date.now());
          });
        }

        try {
          if (!localStorage.getItem(CACHE_GUARD_KEY)) {
            localStorage.setItem(CACHE_GUARD_KEY, '1');
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) {
                  if (name.indexOf('v3') === -1) {
                    caches.delete(name);
                  }
                });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.update(); });
              });
            }
          }
        } catch (e) {}

        window.addEventListener('load', function () {
          setTimeout(function () {
            try {
              var probe = document.createElement('div');
              probe.className = 'hidden';
              document.body.appendChild(probe);
              var isTailwindLoaded = window.getComputedStyle(probe).display === 'none';
              document.body.removeChild(probe);
              if (!isTailwindLoaded) {
                purgeStaleCachesAndReload();
              } else {
                sessionStorage.removeItem('elimika_css_recovering');
              }
            } catch (e) {}
          }, 900);
        });
      })();
    </script>
